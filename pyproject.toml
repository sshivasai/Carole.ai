[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carole.ai"
version = "0.1.0"
description = "A local AI agent workspace with a FastAPI backend and integrated web UI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Carole.ai" }]
keywords = ["ai", "agents", "assistant", "mcp", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
  "python-dotenv>=1.0.0",
  "sqlalchemy>=2.0.0,<2.1",
  "aiosqlite>=0.19.0",
  "alembic>=1.13.0",
  "lancedb>=0.5.0",
  "httpx>=0.25.0",
  "pydantic>=2.0.0",
  "jsonschema>=4.23.0,<5",
  "referencing>=0.35.0,<1",
  "pydantic-settings>=2.0.0",
  "python-multipart>=0.0.6",
  "PyPDF2>=3.0.0",
  "networkx>=3.0.0",
  "google-api-python-client>=2.0.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.0",
  "mcp>=1.0.0,<3",
  "websockets>=12.0",
  "langchain-openai",
  "langchain-anthropic",
  "langchain-google-genai",
  "aiohttp>=3.9.0",
  "slowapi>=0.1.9",
  "playwright>=1.40.0",
  "browser-use",
  "python-docx>=1.0.0",
  "markitdown>=0.1.7",
  "beautifulsoup4>=4.12.0",
  "markdownify>=0.14.0",
  "aiofiles>=23.0.0",
  "h2>=4.1.0",
  "rank-bm25>=0.2.2",
  "tree-sitter>=0.26.0",
  "tree-sitter-python>=0.25.0",
  "tree-sitter-javascript>=0.25.0",
  "tree-sitter-typescript>=0.23.0",
  "tree-sitter-rust>=0.24.0",
  "tree-sitter-go>=0.25.0",
  "tree-sitter-java>=0.23.0",
  "tree-sitter-c>=0.24.0",
  "tree-sitter-cpp>=0.23.0",
  "tree-sitter-c-sharp>=0.23.0",
  "tree-sitter-ruby>=0.23.0",
  "tree-sitter-php>=0.24.0",
  "tree-sitter-html>=0.23.0",
  "tree-sitter-css>=0.25.0",
  "tree-sitter-json>=0.24.0",
  "tree-sitter-bash>=0.25.0",
  "tree-sitter-yaml>=0.7.0",
  "tree-sitter-toml>=0.7.0",
  "tree-sitter-lua>=0.5.0",
  "tree-sitter-markdown>=0.5.0",
  "tree-sitter-scala>=0.26.0",
  "tree-sitter-kotlin>=1.1.0",
  "tree-sitter-swift>=0.7.0",
  "tree-sitter-sql>=0.3.0",
  "tree-sitter-elixir>=0.3.0",
  "tree-sitter-zig>=1.1.0",
  "tree-sitter-make>=1.1.0",
  "tree-sitter-cmake>=0.7.0",
  "model2vec>=0.9.0",
  "flashrank>=0.2.10",
  "traceloop-sdk>=0.62.0",
  "croniter>=6.0.0,<7",
]

[project.urls]
Homepage = "https://github.com/sshivasai/Carole.ai"
Repository = "https://github.com/sshivasai/Carole.ai"
Issues = "https://github.com/sshivasai/Carole.ai/issues"

[project.scripts]
caroleai = "carole_ai.cli:main"

[tool.setuptools]
package-dir = { "" = "backend" }
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["backend"]
include = ["carole_ai*", "core*", "plugins*"]
namespaces = true

[tool.setuptools.package-data]
carole_ai = [
  "web/*",
  "web/**/*",
  "web/**/**/*",
  "resources/*",
  "resources/**/*",
  "resources/**/**/*",
]
core = ["defaults/*.json", "tools/*.js"]
