version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: carole_postgres
    restart: always
    environment:
      POSTGRES_USER: charoledb
      POSTGRES_PASSWORD: charolepassword
      POSTGRES_DB: charoledb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charoledb -d charoledb"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: ./backend
    container_name: carole_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  web:
    build:
      context: ./frontend
    container_name: carole_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

  pgadmin:
    image: dpage/pgadmin4
    container_name: carole_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@carole.ai
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
