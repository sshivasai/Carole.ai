<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="osGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="osBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="osGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Shield/Rounded Box -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#osBg)" stroke="url(#osGrad)" stroke-width="2" />
  
  <!-- Open Source Initiative / Unlock Emblem -->
  <g filter="url(#osGlow)">
    <!-- Outer Arc Ring -->
    <path d="M32 16 A16 16 0 1 1 20 42" stroke="url(#osGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Opening Key Notch -->
    <circle cx="20" cy="42" r="3" fill="#38bdf8" />
    <!-- Center Core Star/Diamond -->
    <polygon points="32,23 35,32 44,32 37,38 39,47 32,42 25,47 27,38 20,32 29,32" fill="url(#osGrad)" opacity="0.9" />
  </g>
</svg>
