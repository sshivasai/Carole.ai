<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="mcpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="mcpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Box -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#mcpBg)" stroke="url(#mcpGrad)" stroke-width="2" />
  
  <!-- Universal MCP Plug & Data Bus Connector Emblem -->
  <g filter="url(#mcpGlow)">
    <!-- Plug Body -->
    <rect x="22" y="26" width="20" height="18" rx="5" fill="#0f172a" stroke="url(#mcpGrad)" stroke-width="2" />
    
    <!-- Plug Prongs / Pins -->
    <line x1="27" y1="18" x2="27" y2="26" stroke="url(#mcpGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="37" y1="18" x2="37" y2="26" stroke="url(#mcpGrad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Bottom Cable / Data Bus -->
    <path d="M32 44 V50" stroke="url(#mcpGrad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Active Node Indicator -->
    <circle cx="32" cy="35" r="3" fill="#a78bfa" />
  </g>
</svg>
