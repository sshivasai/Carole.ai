<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="subBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="subGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Glassmorphic Badge Frame -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#subBg)" stroke="url(#subGrad)" stroke-width="1.75" />

  <!-- Ambient Inner Glow Orb -->
  <circle cx="32" cy="32" r="18" fill="url(#subGrad)" opacity="0.12" filter="url(#subGlow)" />

  <!-- Hierarchical Multi-Agent Tree -->
  <g filter="url(#subGlow)">
    <!-- Delegation Connecting Arcs -->
    <path d="M32 26 L20 40" stroke="url(#subGrad)" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="2 3" />
    <path d="M32 26 L44 40" stroke="url(#subGrad)" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="2 3" />
    <path d="M32 26 L32 40" stroke="url(#subGrad)" stroke-width="1.75" stroke-linecap="round" />

    <!-- Master Lead Agent (Top Center) -->
    <rect x="25" y="16" width="14" height="12" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1.75" />
    <!-- Glowing Robot Eyes -->
    <circle cx="29" cy="22" r="1.5" fill="#a7f3d0" />
    <circle cx="35" cy="22" r="1.5" fill="#a7f3d0" />
    <line x1="32" y1="13" x2="32" y2="16" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="32" cy="12" r="1.2" fill="#34d399" />

    <!-- Subagent 1 (Left) -->
    <rect x="15" y="38" width="10" height="9" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <circle cx="18.5" cy="42.5" r="1" fill="#34d399" />
    <circle cx="21.5" cy="42.5" r="1" fill="#34d399" />

    <!-- Subagent 2 (Center) -->
    <rect x="27" y="38" width="10" height="9" rx="3" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="30.5" cy="42.5" r="1" fill="#67e8f9" />
    <circle cx="33.5" cy="42.5" r="1" fill="#67e8f9" />

    <!-- Subagent 3 (Right) -->
    <rect x="39" y="38" width="10" height="9" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <circle cx="42.5" cy="42.5" r="1" fill="#34d399" />
    <circle cx="45.5" cy="42.5" r="1" fill="#34d399" />
  </g>
</svg>
