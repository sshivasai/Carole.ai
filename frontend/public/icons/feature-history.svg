<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="histGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="histGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="6" y="6" width="52" height="52" rx="16" fill="#091428" stroke="url(#histGrad)" stroke-width="2" filter="url(#histGlow)" />
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#histGrad)" fill-opacity="0.12" />

  <!-- Rewind Clock & Code Diff Stack -->
  <circle cx="32" cy="32" r="14" stroke="#06B6D4" stroke-width="2" stroke-dasharray="3 3" />
  <path d="M32 24V32L38 35" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
