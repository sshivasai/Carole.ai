<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="multiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="multiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a044e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="multiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Box -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#multiBg)" stroke="url(#multiGrad)" stroke-width="2" />
  
  <!-- Multi-Modal Documents & Media Stack -->
  <g filter="url(#multiGlow)">
    <!-- Back Document -->
    <rect x="24" y="16" width="22" height="28" rx="4" fill="#1e1b4b" stroke="url(#multiGrad)" stroke-width="1.5" opacity="0.7" />
    <!-- Front Document -->
    <rect x="18" y="22" width="22" height="28" rx="4" fill="#0f172a" stroke="url(#multiGrad)" stroke-width="2" />
    
    <!-- Code / Text Lines -->
    <line x1="22" y1="28" x2="30" y2="28" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    <line x1="22" y1="34" x2="36" y2="34" stroke="#ec4899" stroke-width="2" stroke-linecap="round" />
    <line x1="22" y1="40" x2="32" y2="40" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
    
    <!-- Multimodal Media Sparkle -->
    <path d="M38 18 L39.5 22 L43.5 23.5 L39.5 25 L38 29 L36.5 25 L32.5 23.5 L36.5 22 Z" fill="#f59e0b" />
  </g>
</svg>
