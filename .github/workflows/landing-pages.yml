name: Publish landing page

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/landing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build static frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Stage landing page only
        run: |
          mkdir site
          cp frontend/out/hosted.html site/index.html
          cp -R frontend/out/_next frontend/out/branding frontend/out/logos site/
          cp frontend/out/favicon.ico frontend/out/apple-touch-icon.png site/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
