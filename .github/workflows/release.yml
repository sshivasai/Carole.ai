name: Publish Carole.ai

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build frontend and stage package resources
        run: python scripts/prepare_release.py

      - name: Build and verify distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Verify wheel entry point
        run: |
          python -m venv wheel-test
          wheel-test/bin/pip install dist/*.whl
          wheel-test/bin/caroleai --version
          wheel-test/bin/pip check
          test -f wheel-test/lib/python3.12/site-packages/carole_ai/web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/carole-ai/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
